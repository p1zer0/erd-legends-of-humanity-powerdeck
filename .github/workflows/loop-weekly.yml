name: Verbesserungs-Loop

# Sucht wöchentlich nach Lücken und öffnet einen Pull Request mit Vorschlägen.
# Der Loop schreibt bewusst nie direkt in data/ – siehe docs/AGENTEN.md.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  vorschlagen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Loop laufen lassen
        run: python -m powerdeck loop 2>&1 | tee loop.log
        env:
          PYTHONPATH: src

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo '## Vorschläge dieser Woche'
            echo '```'
            cat loop.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pull Request öffnen
        uses: peter-evans/create-pull-request@v6
        with:
          branch: loop/vorschlaege
          title: "Verbesserungsvorschläge des Loops"
          commit-message: "Loop: Vorschläge vom Wochenlauf"
          add-paths: proposals/
          delete-branch: true
          body: |
            Automatisch erzeugte Vorschläge des Verbesserungs-Loops.

            **Nicht ungelesen mergen.** Jede `.md`-Datei unter `proposals/`
            enthält eine Checkliste mit dem, was zu prüfen ist. Vorschläge zu
            `data/roster.json` sind prüfpflichtig: sie enthalten Aussagen über
            reale Personen und Organisationen.

            Übernehmen mit:

            ```bash
            python3 -m powerdeck loop --anwenden proposals/<datei>.json
            # roster-Vorschläge zusätzlich mit --bestaetigt
            ```

            Hintergrund: `docs/AGENTEN.md`
